<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Manager</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Project<span>Board</span></h1>
    </header>

    <main>
      <div class="section-head">
        <h2>Projects</h2>
        <button id="new-project" class="btn">+ New Project</button>
      </div>
      <div id="projects" class="grid"></div>
      <div class="section-head dev-head">
        <h2>Developers</h2>
        <button id="new-developer" class="btn">+ New Developer</button>
      </div>
      <div id="developers" class="dev-list"></div>
    </main>

    <div id="modal" class="modal hidden">
      <div class="modal-box">
        <button id="close-modal" class="close">&times;</button>
        <div id="modal-content"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
